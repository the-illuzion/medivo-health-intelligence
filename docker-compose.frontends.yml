# ============================================================================
# Medivo Health Intelligence Platform — Independent Frontends Stack
# Deployable as an independent Coolify Resource / Docker Compose stack
# Includes:
#   1. customer-app  (React Native Web / Expo 51 on Port 8081)
#   2. doctor-portal (Next.js 14 App Router on Port 3001)
#   3. admin-panel   (Next.js 14 App Router on Port 3002)
#   4. marketing-web (Next.js 14 App Router on Port 3000)
# ============================================================================

version: '3.8'

services:
  # ============================================================================
  # 1. Customer Web App (React Native Web / Expo 51)
  # Container Port: 8081
  # ============================================================================
  customer-app:
    build:
      context: .
      dockerfile: apps/customer-app/Dockerfile
    container_name: medivo-customer-app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8081/health || curl -sf http://127.0.0.1:8081/health || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.docker.network=medivo-network"
      - "traefik.http.routers.medivo-app.rule=Host(`app.80.225.215.96.sslip.io`) || Host(`www.app.80.225.215.96.sslip.io`) || Host(`app.medivo.duckdns.org`) || Host(`www.app.medivo.duckdns.org`) || Host(`${APP_DOMAIN:-app.80.225.215.96.sslip.io}`) || PathPrefix(`/app`)"
      - "traefik.http.routers.medivo-app.service=medivo-app"
      - "traefik.http.routers.medivo-app.priority=85"
      - "traefik.http.services.medivo-app.loadbalancer.server.port=8081"
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    networks:
      - medivo-network

  # ============================================================================
  # 2. Doctor Portal (Next.js 14 App Router)
  # Container Port: 3001
  # ============================================================================
  doctor-portal:
    build:
      context: .
      dockerfile: apps/doctor-portal/Dockerfile
    container_name: medivo-doctor-portal
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      INTERNAL_API_URL: http://customer-bff:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.docker.network=medivo-network"
      - "traefik.http.routers.medivo-doctor.rule=Host(`doctor.80.225.215.96.sslip.io`) || Host(`www.doctor.80.225.215.96.sslip.io`) || Host(`doctor.medivo.duckdns.org`) || Host(`www.doctor.medivo.duckdns.org`) || Host(`${DOCTOR_DOMAIN:-doctor.80.225.215.96.sslip.io}`) || PathPrefix(`/doctor-portal`)"
      - "traefik.http.routers.medivo-doctor.service=medivo-doctor"
      - "traefik.http.routers.medivo-doctor.priority=80"
      - "traefik.http.services.medivo-doctor.loadbalancer.server.port=3001"
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M
    networks:
      - medivo-network

  # ============================================================================
  # 3. Platform Admin Console (Next.js 14 App Router)
  # Container Port: 3002
  # ============================================================================
  admin-panel:
    build:
      context: .
      dockerfile: apps/admin-panel/Dockerfile
    container_name: medivo-admin-panel
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      INTERNAL_API_URL: http://customer-bff:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3002/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.docker.network=medivo-network"
      - "traefik.http.routers.medivo-admin.rule=Host(`admin.80.225.215.96.sslip.io`) || Host(`www.admin.80.225.215.96.sslip.io`) || Host(`admin.medivo.duckdns.org`) || Host(`www.admin.medivo.duckdns.org`) || Host(`${ADMIN_DOMAIN:-admin.80.225.215.96.sslip.io}`) || PathPrefix(`/admin-panel`)"
      - "traefik.http.routers.medivo-admin.service=medivo-admin"
      - "traefik.http.routers.medivo-admin.priority=80"
      - "traefik.http.services.medivo-admin.loadbalancer.server.port=3002"
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M
    networks:
      - medivo-network

  # ============================================================================
  # 4. Marketing Website (Next.js 14 App Router) - main.80.225.215.96.sslip.io
  # Container Port: 3000
  # ============================================================================
  marketing-web:
    build:
      context: .
      dockerfile: apps/marketing-web/Dockerfile
    container_name: medivo-marketing-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_URL: http://customer-bff:4000
      INTERNAL_APP_URL: http://customer-app:8081
      INTERNAL_DOCTOR_URL: http://doctor-portal:3001
      INTERNAL_ADMIN_URL: http://admin-panel:3002
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.docker.network=medivo-network"
      - "traefik.http.routers.medivo-web.rule=Host(`main.80.225.215.96.sslip.io`) || Host(`www.main.80.225.215.96.sslip.io`) || Host(`main.medivo.duckdns.org`) || Host(`www.main.medivo.duckdns.org`) || Host(`medivo.duckdns.org`) || Host(`www.medivo.duckdns.org`) || Host(`80.225.215.96.sslip.io`) || Host(`www.80.225.215.96.sslip.io`) || Host(`${WEB_DOMAIN:-main.80.225.215.96.sslip.io}`) || HostRegexp(`{host:.+}`)"
      - "traefik.http.routers.medivo-web.service=medivo-web"
      - "traefik.http.routers.medivo-web.priority=10"
      - "traefik.http.services.medivo-web.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M
    networks:
      - medivo-network

networks:
  medivo-network:
    name: medivo-network
    external: true
