# ============================================================================
# Medivo Health Intelligence Platform — Independent Infrastructure Stack
# Deployable as an independent Coolify Resource / Docker Compose stack
# Host Specs: Oracle Cloud Infrastructure (OCI) Ubuntu (4 OCPU / 24 GB RAM)
# ============================================================================

version: '3.8'

services:
  # ============================================================================
  # 1. PostgreSQL 16 Cluster (13 Domain Schemas Modular Monolith Database)
  # Internal Port: 5432 (No Host Port Binding)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: medivo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-medivo_secure_password_change_in_prod}
      POSTGRES_DB: ${DATABASE_NAME:-medivo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/api/src/infrastructure/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-medivo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 4096M
        reservations:
          memory: 1024M
    networks:
      - medivo-network

  # ============================================================================
  # 2. Redis 7 Cluster (BullMQ Queue & Session Cache)
  # Internal Port: 6379 (No Host Port Binding)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: medivo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 1024mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    networks:
      - medivo-network

  # ============================================================================
  # 3. MinIO S3-Compatible Object Storage (AI Scan Image Vault)
  # Internal Port: 9000 (API), 9001 (Console)
  # ============================================================================
  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: medivo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-medivo_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-medivo_minio_secure_password}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M
    networks:
      - medivo-network

  # ============================================================================
  # 4. Mailpit Mock SMTP Server (Optional / Staging Email Capture)
  # Internal Port: 1025 (SMTP), 8025 (Web UI)
  # ============================================================================
  mailpit:
    image: axllent/mailpit:v1.15
    container_name: medivo-mailpit
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - medivo-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  medivo-network:
    name: medivo-network
    external: true
