version: '3.8'

services:
  # ============================================================================
  # 1. PostgreSQL 16 Cluster (13 Schema Modular Monolith Database)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: medivo-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-medivo}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/api/src/infrastructure/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-medivo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. Redis 7 Cluster (BullMQ Queue & Session Cache)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: medivo-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 3. MinIO S3-Compatible Object Storage (AI Scan Vault)
  # ============================================================================
  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: medivo-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 4. Mailpit SMTP Mock Server
  # ============================================================================
  mailpit:
    image: axllent/mailpit:v1.15
    container_name: medivo-mailpit
    restart: always
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "8025:8025"

  # ============================================================================
  # 5. Customer BFF REST API Service
  # ============================================================================
  customer-bff:
    build:
      context: .
      dockerfile: apps/customer-bff/Dockerfile
    container_name: medivo-customer-bff
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@postgres:5432/${DATABASE_NAME:-medivo}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-medivo-production-jwt-secret-key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================================
  # 6. Marketing Website (Next.js 14 App Router)
  # ============================================================================
  marketing-web:
    build:
      context: .
      dockerfile: apps/marketing-web/Dockerfile
    container_name: medivo-marketing-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000

  # ============================================================================
  # 7. Doctor Portal (Next.js 14 App Router)
  # ============================================================================
  doctor-portal:
    build:
      context: .
      dockerfile: apps/doctor-portal/Dockerfile
    container_name: medivo-doctor-portal
    restart: always
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: http://localhost:4000

  # ============================================================================
  # 8. Platform Admin Console (Next.js 14 App Router)
  # ============================================================================
  admin-panel:
    build:
      context: .
      dockerfile: apps/admin-panel/Dockerfile
    container_name: medivo-admin-panel
    restart: always
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      NEXT_PUBLIC_API_URL: http://localhost:4000

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  default:
    name: medivo-network
