# ============================================================================
# Medivo Health Intelligence Platform — Independent Microservices Stack
# Deployable as an independent Coolify Resource / Docker Compose stack
# Includes: AI Engine, Auth, Appointments, Commerce, Notifications
# ============================================================================

version: '3.8'

services:
  # ============================================================================
  # 1. AI Vision Engine Microservice (Internal Microservice)
  # Container Port: 8080
  # ============================================================================
  service-ai:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    container_name: medivo-service-ai
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      MODEL_VERSION: v2.4-onnx-resnet50
      AI_PROVIDER_DEFAULT: ${AI_PROVIDER_DEFAULT:-AUTO}
      PERFECT_CORP_API_KEY: ${PERFECT_CORP_API_KEY:-}
      PERFECT_CORP_SECRET_KEY: ${PERFECT_CORP_SECRET_KEY:-}
      SHEN_API_KEY: ${SHEN_API_KEY:-}
      SHEN_CLIENT_SECRET: ${SHEN_CLIENT_SECRET:-}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M
    networks:
      - medivo-network

  # ============================================================================
  # 2. Auth & Session Microservice (Internal Microservice)
  # Container Port: 4001
  # ============================================================================
  service-auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: medivo-service-auth
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4001
      JWT_SECRET: ${JWT_SECRET:-medivo-production-jwt-secret-key-change-in-prod}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:4001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    networks:
      - medivo-network

  # ============================================================================
  # 3. Appointments & Telehealth Microservice (Internal Microservice)
  # Container Port: 4002
  # ============================================================================
  service-appointments:
    build:
      context: .
      dockerfile: services/appointments/Dockerfile
    container_name: medivo-service-appointments
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4002
      DATABASE_URL: postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-medivo_secure_password_change_in_prod}@postgres:5432/${DATABASE_NAME:-medivo}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:4002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    networks:
      - medivo-network

  # ============================================================================
  # 4. Skincare Commerce Microservice (Internal Microservice)
  # Container Port: 4003
  # ============================================================================
  service-commerce:
    build:
      context: .
      dockerfile: services/commerce/Dockerfile
    container_name: medivo-service-commerce
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4003
      DATABASE_URL: postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-medivo_secure_password_change_in_prod}@postgres:5432/${DATABASE_NAME:-medivo}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:4003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    networks:
      - medivo-network

  # ============================================================================
  # 5. Notifications & Dispatcher Microservice (Internal Microservice)
  # Container Port: 4004
  # ============================================================================
  service-notifications:
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    container_name: medivo-service-notifications
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4004
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:4004/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    networks:
      - medivo-network

networks:
  medivo-network:
    name: medivo-network
    external: true
