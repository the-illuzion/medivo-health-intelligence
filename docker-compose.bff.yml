# ============================================================================
# Medivo Health Intelligence Platform — Independent Customer BFF Stack
# Deployable as an independent Coolify Resource / Docker Compose stack
# Includes: Customer BFF REST API Gateway
# ============================================================================

version: '3.8'

services:
  # ============================================================================
  # 1. Customer BFF REST API Service (Public API Entry Point)
  # Container Port: 4000
  # ============================================================================
  customer-bff:
    build:
      context: .
      dockerfile: apps/customer-bff/Dockerfile
    container_name: medivo-customer-bff
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-medivo_secure_password_change_in_prod}@postgres:5432/${DATABASE_NAME:-medivo}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-medivo-production-jwt-secret-key-change-in-prod}
      AI_SERVICE_URL: http://service-ai:8080
      AUTH_SERVICE_URL: http://service-auth:4001
      APPOINTMENTS_SERVICE_URL: http://service-appointments:4002
      COMMERCE_SERVICE_URL: http://service-commerce:4003
      NOTIFICATIONS_SERVICE_URL: http://service-notifications:4004
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-medivo}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-medivo_admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-medivo_minio_secure_password}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.docker.network=medivo-network"
      # HTTP Router (Port 80)
      - "traefik.http.routers.medivo-bff-http.rule=Host(`api.80.225.215.96.sslip.io`) || Host(`www.api.80.225.215.96.sslip.io`) || Host(`api.medivo.duckdns.org`) || Host(`www.api.medivo.duckdns.org`) || Host(`medivo-api.duckdns.org`) || Host(`www.medivo-api.duckdns.org`) || Host(`${API_DOMAIN:-api.80.225.215.96.sslip.io}`) || ((Host(`main.80.225.215.96.sslip.io`) || Host(`www.main.80.225.215.96.sslip.io`) || Host(`main.medivo.duckdns.org`) || Host(`www.main.medivo.duckdns.org`) || Host(`medivo.duckdns.org`) || Host(`www.medivo.duckdns.org`) || Host(`80.225.215.96.sslip.io`) || Host(`www.80.225.215.96.sslip.io`) || Host(`${WEB_DOMAIN:-main.80.225.215.96.sslip.io}`)) && (PathPrefix(`/api`) || PathPrefix(`/health`)))"
      - "traefik.http.routers.medivo-bff-http.service=medivo-bff"
      - "traefik.http.routers.medivo-bff-http.priority=100"
      # HTTPS Router (Port 443 with TLS)
      - "traefik.http.routers.medivo-bff.rule=Host(`api.80.225.215.96.sslip.io`) || Host(`www.api.80.225.215.96.sslip.io`) || Host(`api.medivo.duckdns.org`) || Host(`www.api.medivo.duckdns.org`) || Host(`medivo-api.duckdns.org`) || Host(`www.medivo-api.duckdns.org`) || Host(`${API_DOMAIN:-api.80.225.215.96.sslip.io}`) || ((Host(`main.80.225.215.96.sslip.io`) || Host(`www.main.80.225.215.96.sslip.io`) || Host(`main.medivo.duckdns.org`) || Host(`www.main.medivo.duckdns.org`) || Host(`medivo.duckdns.org`) || Host(`www.medivo.duckdns.org`) || Host(`80.225.215.96.sslip.io`) || Host(`www.80.225.215.96.sslip.io`) || Host(`${WEB_DOMAIN:-main.80.225.215.96.sslip.io}`)) && (PathPrefix(`/api`) || PathPrefix(`/health`)))"
      - "traefik.http.routers.medivo-bff.service=medivo-bff"
      - "traefik.http.routers.medivo-bff.priority=100"
      - "traefik.http.routers.medivo-bff.tls=true"
      - "traefik.http.services.medivo-bff.loadbalancer.server.port=4000"
    volumes:
      - ./logs/bff:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M
    networks:
      - medivo-network

networks:
  medivo-network:
    name: medivo-network
    external: true
