# ============================================================================
# Medivo Health Intelligence Platform — Independent Management Stack
# Deployable as an independent Coolify Resource / Docker Compose stack
# Includes:
#   1. CloudBeaver (PostgreSQL Web GUI & SQL Studio)
#   2. Redis Insight (Redis Key, Value & Queue Inspector)
#   3. DbGate (All-in-One Modern Database & Redis Manager)
# Zero Public Database Ports: Accessible securely via Traefik HTTPS routers
# ============================================================================

version: '3.8'

services:
  # ============================================================================
  # 1. CloudBeaver Community Edition (PostgreSQL Web GUI & SQL Studio)
  # Internal Port: 8978
  # ============================================================================
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: medivo-cloudbeaver
    restart: unless-stopped
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8978/ || wget -q --spider http://127.0.0.1:8978/ || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.docker.network=medivo-network"
      - "traefik.http.routers.medivo-cloudbeaver.rule=Host(`${DB_ADMIN_DOMAIN:-db-admin.80.225.215.96.sslip.io}`) || Host(`db-admin.medivo.duckdns.org`)"
      - "traefik.http.routers.medivo-cloudbeaver.service=medivo-cloudbeaver"
      - "traefik.http.routers.medivo-cloudbeaver.priority=200"
      - "traefik.http.services.medivo-cloudbeaver.loadbalancer.server.port=8978"
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    networks:
      - medivo-network

  # ============================================================================
  # 2. Redis Insight (Redis Key, Value & Queue Inspector)
  # Internal Port: 5540
  # ============================================================================
  redis-insight:
    image: redis/redisinsight:latest
    container_name: medivo-redis-insight
    restart: unless-stopped
    volumes:
      - redis_insight_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5540', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.docker.network=medivo-network"
      - "traefik.http.routers.medivo-redis-insight.rule=Host(`${REDIS_ADMIN_DOMAIN:-redis-admin.80.225.215.96.sslip.io}`) || Host(`redis-admin.medivo.duckdns.org`)"
      - "traefik.http.routers.medivo-redis-insight.service=medivo-redis-insight"
      - "traefik.http.routers.medivo-redis-insight.priority=200"
      - "traefik.http.services.medivo-redis-insight.loadbalancer.server.port=5540"
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    networks:
      - medivo-network

  # ============================================================================
  # 3. DbGate (All-in-One Web Manager for PostgreSQL + Redis)
  # Internal Port: 3000
  # ============================================================================
  dbgate:
    image: dbgate/dbgate:latest
    container_name: medivo-dbgate
    restart: unless-stopped
    environment:
      # 1. Mandatory Web Authentication (Enforces Login Screen on http://db...)
      LOGIN: "${MANAGEMENT_USER:-admin}"
      PASSWORD: "${MANAGEMENT_PASSWORD:-MedivoAdmin@2026!}"

      # 2. Pre-configured internal connection endpoints
      CONNECTIONS: "postgres,redis"
      LABEL_postgres: "Medivo PostgreSQL (13 Schemas)"
      SERVER_postgres: "postgres"
      PORT_postgres: "5432"
      USER_postgres: "${DATABASE_USER:-postgres}"
      PASSWORD_postgres: "${DATABASE_PASSWORD:-medivo_secure_password_change_in_prod}"
      DATABASE_postgres: "${DATABASE_NAME:-medivo}"
      ENGINE_postgres: "postgres@dbgate-plugin-postgres"

      LABEL_redis: "Medivo Redis Cache"
      SERVER_redis: "redis"
      PORT_redis: "6379"
      ENGINE_redis: "redis@dbgate-plugin-redis"
    volumes:
      - dbgate_data:/root/.dbgate
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.docker.network=medivo-network"
      - "traefik.http.routers.medivo-dbgate.rule=Host(`db.80.225.215.96.sslip.io`) || Host(`db.medivo.duckdns.org`) || Host(`dbgate.80.225.215.96.sslip.io`) || Host(`dbgate.medivo.duckdns.org`) || Host(`${DBGATE_DOMAIN:-db.80.225.215.96.sslip.io}`)"
      - "traefik.http.routers.medivo-dbgate.service=medivo-dbgate"
      - "traefik.http.routers.medivo-dbgate.priority=200"
      - "traefik.http.services.medivo-dbgate.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - medivo-network

volumes:
  cloudbeaver_data:
    driver: local
  redis_insight_data:
    driver: local
  dbgate_data:
    driver: local

networks:
  medivo-network:
    name: medivo-network
    external: true
