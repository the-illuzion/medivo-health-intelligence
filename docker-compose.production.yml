# ============================================================================
# Medivo Health Intelligence Platform — Production Coolify Compose Stack
# Target Host: Oracle Cloud Infrastructure (OCI) Ubuntu (4 OCPU / 24 GB RAM)
# Reverse Proxy: Traefik managed by Coolify (Host ports 80/443 owned by Traefik)
# Supports: HTTP & HTTPS, Single Domain (Path-based Routing) AND Multi-Domain
# ============================================================================

version: '3.8'

services:
  # ============================================================================
  # 1. PostgreSQL 16 Cluster (13 Domain Schemas Modular Monolith Database)
  # Internal Only: Accessible to internal services via postgres:5432
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: medivo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-medivo_secure_password_change_in_prod}
      POSTGRES_DB: ${DATABASE_NAME:-medivo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/api/src/infrastructure/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-medivo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 4096M
        reservations:
          memory: 1024M
    networks:
      - medivo-network

  # ============================================================================
  # 2. Redis 7 Cluster (BullMQ Queue & Session Cache)
  # Internal Only: Accessible via redis:6379
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: medivo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 1024mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    networks:
      - medivo-network

  # ============================================================================
  # 3. MinIO S3-Compatible Object Storage (AI Scan Image Vault)
  # Internal Only: Accessible via minio:9000
  # ============================================================================
  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: medivo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-medivo_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-medivo_minio_secure_password}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M
    networks:
      - medivo-network

  # ============================================================================
  # 4. Customer BFF REST API Service (Public API Entry Point & /api Ingress)
  # Container Port: 4000
  # ============================================================================
  customer-bff:
    build:
      context: .
      dockerfile: apps/customer-bff/Dockerfile
    container_name: medivo-customer-bff
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-medivo_secure_password_change_in_prod}@postgres:5432/${DATABASE_NAME:-medivo}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-medivo-production-jwt-secret-key-change-in-prod}
      AI_SERVICE_URL: http://service-ai:8080
      AUTH_SERVICE_URL: http://service-auth:4001
      APPOINTMENTS_SERVICE_URL: http://service-appointments:4002
      COMMERCE_SERVICE_URL: http://service-commerce:4003
      NOTIFICATIONS_SERVICE_URL: http://service-notifications:4004
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-medivo}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-medivo_admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-medivo_minio_secure_password}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.medivo-bff.rule=(Host(`wftkumlt9lhq2hfvamqqavzu.80.225.215.96.sslip.io`) || Host(`${API_DOMAIN:-wftkumlt9lhq2hfvamqqavzu.80.225.215.96.sslip.io}`) || Host(`${WEB_DOMAIN:-wftkumlt9lhq2hfvamqqavzu.80.225.215.96.sslip.io}`)) && (PathPrefix(`/api`) || PathPrefix(`/health`))"
      - "traefik.http.routers.medivo-bff.priority=100"
      - "traefik.http.services.medivo-bff.loadbalancer.server.port=4000"
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M
    networks:
      - medivo-network

  # ============================================================================
  # 5. Marketing Website (Next.js 14 App Router)
  # Container Port: 3000
  # ============================================================================
  marketing-web:
    build:
      context: .
      dockerfile: apps/marketing-web/Dockerfile
    container_name: medivo-marketing-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_URL: http://customer-bff:4000
      INTERNAL_APP_URL: http://customer-app:8081
      INTERNAL_DOCTOR_URL: http://doctor-portal:3001
      INTERNAL_ADMIN_URL: http://admin-panel:3002
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.medivo-web.rule=Host(`wftkumlt9lhq2hfvamqqavzu.80.225.215.96.sslip.io`) || Host(`${WEB_DOMAIN:-wftkumlt9lhq2hfvamqqavzu.80.225.215.96.sslip.io}`) || Host(`${WEB_WWW_DOMAIN:-www.example.com}`)"
      - "traefik.http.routers.medivo-web.priority=10"
      - "traefik.http.services.medivo-web.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M
    networks:
      - medivo-network

  # ============================================================================
  # 6. Customer Web App (React Native Web / Expo 51)
  # Container Port: 8081
  # ============================================================================
  customer-app:
    build:
      context: .
      dockerfile: apps/customer-app/Dockerfile
    container_name: medivo-customer-app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.medivo-app.rule=Host(`${APP_DOMAIN:-app.example.com}`) || ((Host(`wftkumlt9lhq2hfvamqqavzu.80.225.215.96.sslip.io`) || Host(`${WEB_DOMAIN:-wftkumlt9lhq2hfvamqqavzu.80.225.215.96.sslip.io}`)) && PathPrefix(`/app`))"
      - "traefik.http.routers.medivo-app.priority=85"
      - "traefik.http.services.medivo-app.loadbalancer.server.port=8081"
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    networks:
      - medivo-network

  # ============================================================================
  # 7. Doctor Portal (Next.js 14 App Router)
  # Container Port: 3001
  # ============================================================================
  doctor-portal:
    build:
      context: .
      dockerfile: apps/doctor-portal/Dockerfile
    container_name: medivo-doctor-portal
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      INTERNAL_API_URL: http://customer-bff:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.medivo-doctor.rule=Host(`${DOCTOR_DOMAIN:-doctor.example.com}`) || ((Host(`wftkumlt9lhq2hfvamqqavzu.80.225.215.96.sslip.io`) || Host(`${WEB_DOMAIN:-wftkumlt9lhq2hfvamqqavzu.80.225.215.96.sslip.io}`)) && PathPrefix(`/doctor-portal`))"
      - "traefik.http.routers.medivo-doctor.priority=80"
      - "traefik.http.services.medivo-doctor.loadbalancer.server.port=3001"
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M
    networks:
      - medivo-network

  # ============================================================================
  # 8. Platform Admin Console (Next.js 14 App Router)
  # Container Port: 3002
  # ============================================================================
  admin-panel:
    build:
      context: .
      dockerfile: apps/admin-panel/Dockerfile
    container_name: medivo-admin-panel
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      INTERNAL_API_URL: http://customer-bff:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3002/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.medivo-admin.rule=Host(`${ADMIN_DOMAIN:-admin.example.com}`) || ((Host(`wftkumlt9lhq2hfvamqqavzu.80.225.215.96.sslip.io`) || Host(`${WEB_DOMAIN:-wftkumlt9lhq2hfvamqqavzu.80.225.215.96.sslip.io}`)) && PathPrefix(`/admin-panel`))"
      - "traefik.http.routers.medivo-admin.priority=80"
      - "traefik.http.services.medivo-admin.loadbalancer.server.port=3002"
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M
    networks:
      - medivo-network

  # ============================================================================
  # 9. AI Vision Engine Microservice (Internal Microservice)
  # Container Port: 8080
  # ============================================================================
  service-ai:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    container_name: medivo-service-ai
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      MODEL_VERSION: v2.4-onnx-resnet50
      AI_PROVIDER_DEFAULT: ${AI_PROVIDER_DEFAULT:-AUTO}
      PERFECT_CORP_API_KEY: ${PERFECT_CORP_API_KEY:-}
      PERFECT_CORP_SECRET_KEY: ${PERFECT_CORP_SECRET_KEY:-}
      SHEN_API_KEY: ${SHEN_API_KEY:-}
      SHEN_CLIENT_SECRET: ${SHEN_CLIENT_SECRET:-}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M
    networks:
      - medivo-network

  # ============================================================================
  # 10. Auth & Session Microservice (Internal Microservice)
  # Container Port: 4001
  # ============================================================================
  service-auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: medivo-service-auth
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4001
      JWT_SECRET: ${JWT_SECRET:-medivo-production-jwt-secret-key-change-in-prod}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:4001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    networks:
      - medivo-network

  # ============================================================================
  # 11. Appointments & Telehealth Microservice (Internal Microservice)
  # Container Port: 4002
  # ============================================================================
  service-appointments:
    build:
      context: .
      dockerfile: services/appointments/Dockerfile
    container_name: medivo-service-appointments
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4002
      DATABASE_URL: postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-medivo_secure_password_change_in_prod}@postgres:5432/${DATABASE_NAME:-medivo}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:4002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    networks:
      - medivo-network

  # ============================================================================
  # 12. Skincare Commerce Microservice (Internal Microservice)
  # Container Port: 4003
  # ============================================================================
  service-commerce:
    build:
      context: .
      dockerfile: services/commerce/Dockerfile
    container_name: medivo-service-commerce
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4003
      DATABASE_URL: postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-medivo_secure_password_change_in_prod}@postgres:5432/${DATABASE_NAME:-medivo}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:4003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    networks:
      - medivo-network

  # ============================================================================
  # 13. Notifications & Dispatcher Microservice (Internal Microservice)
  # Container Port: 4004
  # ============================================================================
  service-notifications:
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    container_name: medivo-service-notifications
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4004
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:4004/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    networks:
      - medivo-network

  # ============================================================================
  # 14. Mailpit Mock SMTP Server (Optional / Staging Email Capture)
  # Container Port: 1025
  # ============================================================================
  mailpit:
    image: axllent/mailpit:v1.15
    container_name: medivo-mailpit
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - medivo-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  medivo-network:
    name: medivo-network
    driver: bridge
